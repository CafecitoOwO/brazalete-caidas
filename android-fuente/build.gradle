plugins {
    id 'com.android.application'
}

android {
    namespace 'com.proyecto.brazalete'
    compileSdk 34

    defaultConfig {
        applicationId "com.proyecto.brazalete"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.7"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Cliente MQTT. Se conecta al mismo broker y a los mismos temas que la
    // app web, para que un telefono con la app nativa y otro con la web se
    // entiendan sin cambiar nada.
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}
